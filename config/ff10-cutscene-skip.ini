[Settings]
; Speed multiplier applied when Turbo is engaged.
; Recommended: 8.0 (fast cutscene skipping), 4.0 (moderate), 16.0 (super fast)
SpeedMultiplier = 8.0

; Automatically bypass dialogue pauses and cutscene wait timers when Turbo is active.
; Set to false to prevent event script cancellation during scripted battle sequences.
SkipCutscenesAtSpeed = true

; Automatically skip the opening publisher and developer logos on game launch.
; Skips Square Enix, Virtuos, CRI, Dolby splash screens and boots directly to the Main Menu.
SkipIntro = true

; Input control mode:
; "Toggle" = Press the hotkey once to activate Turbo, press again to deactivate.
; "Hold"   = Turbo is only active while holding the hotkey or controller button down.
ControlMode = Toggle

; Keyboard hotkey to toggle or hold Turbo (cutscenes, dialogue, and field speed).
; Supported: R, G, F1, F2, F3, F4, F5, TAB, SPACE, C, V, H, etc.
KeyboardHotkey = R

; Enable controller support (XInput / Xbox / PlayStation controllers through Steam Input).
EnableGamepad = true

; Controller button combo to toggle or hold Turbo.
; Format: BUTTON+BUTTON (e.g. SELECT+X, SELECT+A, L3+R3, LB+RB, L1+R1, BACK+X)
; SELECT is the Back / View / Share button on standard gamepads.
GamepadCombo = SELECT+X

; Show a clean, sleek on-screen watermark badge in the top-right corner (e.g. "TURBO 8.0x")
; Appears only when Turbo is active, and vanishes when off or minimized/Alt-Tabbed.
ShowOSD = true

; Automatically disengage and prevent Turbo during combat / boss battles.
; Prevents cutscene skips from skipping monster spawn callbacks or freezing battles.
AutoDisableInBattle = true

; Write diagnostic log messages to cutscene_skip.log in game folder.
LogToFile = true

; Real-time scene & event tracer for debugging.
; Records every opcode, battle transition, and player action live in cutscene_skip.log
DebugMode = true

